<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cofrinho</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cofrinho" />
  <link rel="apple-touch-icon" href="icon-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,400;1,700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <!-- Clash Display — Fontshare (Indian Type Foundry) — display tipográfico 2025 -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=90" />
</head>
<body>
  <div class="backdrop"></div>
  <!-- Arte animada do tema Jump — só visível com body.theme-jump.
       poster: se o autoplay for bloqueado (Modo de Baixa Energia do iOS),
       a arte estática aparece no lugar do vídeo -->
  <video id="jump-art" class="jump-art-video" src="jump-art.mp4" poster="jump-art.jpg"
    muted autoplay loop playsinline preload="auto" aria-hidden="true"></video>
  <script>
    // Autoplay pode ser bloqueado (Baixa Energia) — o primeiro toque destrava
    (function () {
      var v = document.getElementById('jump-art');
      if (!v) return;
      function kick() { v.muted = true; var p = v.play(); if (p) p.catch(function () {}); }
      window.addEventListener('load', kick);
      window.addEventListener('touchend', kick, { passive: true });
      window.addEventListener('click', kick);
    })();
  </script>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      window.pdfjsLib = pdfjsLib;
    }
  </script>
  <!-- Phosphor Icons — duotone weight — MutationObserver processa ícones dinâmicos do React -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <script src="icons.js?v=90"></script>
  <script src="data.js?v=90"></script>
  <script src="onboarding.js?v=90"></script>
  <script src="chart.js?v=90"></script>
  <script src="modal.js?v=90"></script>
  <script src="views.js?v=90"></script>
  <script src="app.js?v=90"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
